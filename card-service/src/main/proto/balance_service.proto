syntax = "proto3";

option java_multiple_files = true;
option java_package = "balance";

service BalanceService{
  rpc CreateCardBalance (CreateCardBalanceRequest) returns (CardBalanceResponse);
}

message CreateCardBalanceRequest {
  string cardNumber = 1;
  int64 balanceAmount = 2;
}

message CardBalanceResponse {
  int32 balanceId = 1;
}