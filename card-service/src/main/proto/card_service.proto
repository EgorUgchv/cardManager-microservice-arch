syntax = "proto3";

option java_multiple_files = true;
option java_package = "card";

service CardService{
  rpc CreateCard (CardRequest) returns (CardResponse);
}

message CardRequest {
  int32 userId = 1;
  string cardNumber = 2;
  string cardHolderFullName = 3;
  string expiryDate = 4;
  int64 balanceAmount = 5;
  string cardStatus = 6;
}

message CardResponse {
  int32 cardId = 1;
  int32 userId = 2;
  int32 balanceId = 3;
}
